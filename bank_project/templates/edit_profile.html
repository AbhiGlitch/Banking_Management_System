{% load static %}
 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
    <title>Edit Profile</title>

    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}" />
  </head>

  <body>
    <div class="navbar">
      <h1>Banking Management System</h1>

      <a href="{% url 'logout' %}" class="logout"> Logout </a>
    </div>

    <div class="form-container">
      <div class="form-card">
        <h2>Edit Profile</h2>

        <p class="form-description">Update your personal information.</p>

        {% if messages %}
        <div class="messages">
          {% for message in messages %}
          <p class="message {{ message.tags }}">{{ message }}</p>
          {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <label>First Name:</label>
          <input type="text" name="first_name" value="{{ user.first_name }}" />

          <label>Last Name:</label>
          <input type="text" name="last_name" value="{{ user.last_name }}" />

          <label>Email:</label>
          <input type="email" name="email" value="{{ user.email }}" />

          <label>Phone:</label>
          <input type="text" name="phone" value="{{ account.phone }}" />

          <label>Address:</label>
          <textarea name="address">{{ account.address }}</textarea>

          <button type="submit" class="btn">Update Profile</button>
        </form>

        <a href="{% url 'profile' %}" class="back-link"> ← Back to Profile </a>
      </div>
    </div>
  </body>
</html>
